<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Soul Vídeo Histórias</title><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body>
<div id="login" class="login"><img src="assets/logo.png"><h1>Painel Soul</h1><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="loginBtn">Entrar</button><p id="loginMsg"></p></div>
<div id="panel" hidden><aside><img src="assets/logo.png"><button data-tab="home">Início</button><button data-tab="about">Quem Somos</button><button data-tab="events">Galeria / Eventos</button><button data-tab="testimonials">Depoimentos</button><button id="logout">Sair</button></aside><main>
<section id="home" class="tab"><h1>Início</h1><label>Frase principal<input id="hTitle"></label><label>Texto<textarea id="hText"></textarea></label><label>Foto ou vídeo de fundo<input id="hMedia" type="file" accept="image/*,video/*"></label><button id="saveHome">Salvar Início</button></section>
<section id="about" class="tab" hidden><h1>Quem Somos</h1><label>Título<input id="aTitle"></label><label>Texto<textarea id="aText"></textarea></label><label>Foto grande<input id="aLarge" type="file" accept="image/*"></label><label>Foto pequena 1<input id="a1" type="file" accept="image/*"></label><label>Foto pequena 2<input id="a2" type="file" accept="image/*"></label><label>Foto pequena 3<input id="a3" type="file" accept="image/*"></label><button id="saveAbout">Salvar Quem Somos</button></section>
<section id="events" class="tab" hidden><h1>Galeria</h1><p>Adicione quantos eventos quiser. Cada evento tem texto, vídeo do YouTube e até quatro fotos.</p><div class="grid"><label>Categoria<select id="eCat"><option>Casamento</option><option>15 anos</option></select></label><label>Submenu<select id="eSub"><option>Teaser</option><option>Save the Date</option></select></label></div><label>Título do evento<input id="eTitle"></label><label>Texto<textarea id="eText"></textarea></label><label>Link do YouTube<input id="eYoutube" placeholder="https://youtube.com/..."></label><div class="grid4"><label>Foto 1<input class="eventPhoto" type="file" accept="image/*"></label><label>Foto 2<input class="eventPhoto" type="file" accept="image/*"></label><label>Foto 3<input class="eventPhoto" type="file" accept="image/*"></label><label>Foto 4<input class="eventPhoto" type="file" accept="image/*"></label></div><button id="addEvent">Adicionar evento</button><div id="eventList"></div></section>
<section id="testimonials" class="tab" hidden><h1>Depoimentos</h1><label>Nome<input id="tName"></label><label>Texto<textarea id="tText"></textarea></label><label>Foto ou vídeo<input id="tMedia" type="file" accept="image/*,video/*"></label><button id="addTestimonial">Adicionar depoimento</button><div id="testimonialList"></div></section>
<p id="status"></p></main></div>
<script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/admin.js"></script></body></html>
